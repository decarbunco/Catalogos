<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <!-- Iconos para Pantalla de Inicio / PWA -->
    <!-- Para iPhone / iPad (iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="SoloLogo.png">
    
    <!-- Para teléfonos Android y navegadores web -->
    <link rel="icon" type="image/png" sizes="32x32" href="SoloLogo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="SoloLogo.png">
    
    <!-- Color de la barra de direcciones en navegadores móviles (Verde Brand) -->
    <meta name="theme-color" content="#00a884">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Decarbunco 3D">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decarbunco 3D - Catálogo & Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Librería PDF.js para renderizado dinámico -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0a0f12',
                            card: '#121a1f',
                            accent: '#00a884',
                            border: '#1f2e35'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-slate-100 min-h-screen flex flex-col font-sans touch-manipulation">

    <!-- Header -->
    <header class="bg-brand-card border-b border-brand-border sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-brand-accent flex items-center justify-center font-bold text-black text-xl">DC</div>
                <div>
                    <h1 class="font-bold text-lg leading-none">Decarbunco 3D</h1>
                    <p class="text-xs text-slate-400">Diseño - Imprimo - Resuelvo</p>
                </div>
            </div>
            <button id="cart-toggle" class="relative bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg border border-brand-border flex items-center space-x-2 transition">
                <i class="fas fa-shopping-cart text-brand-accent"></i>
                <span class="font-semibold text-sm">Carrito</span>
                <span id="cart-count" class="bg-brand-accent text-black text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Content Layout -->
    <div class="max-w-7xl mx-auto w-full flex-1 p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left: Interactive PDF Viewer -->
        <main class="lg:col-span-7 flex flex-col bg-brand-card rounded-xl border border-brand-border overflow-hidden">
            <div class="p-3 bg-slate-900 border-b border-brand-border flex justify-between items-center">
                <span class="text-sm font-semibold text-slate-300"><i class="fas fa-book-open mr-2 text-brand-accent"></i>Catálogo Interactivo</span>
                <a href="Acuario.pdf" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded transition">
                    <i class="fas fa-download mr-1"></i> Descargar PDF
                </a>
            </div>
            
            <div class="w-full h-[520px] lg:h-[750px] bg-slate-950 flex flex-col justify-between p-2 lg:p-4 relative">
                <div class="flex-1 flex items-center justify-center overflow-auto">
                    <canvas id="pdf-canvas" class="max-h-full max-w-full rounded shadow-2xl object-contain"></canvas>
                </div>

                <div class="flex justify-between items-center bg-slate-900/90 border border-brand-border p-2 rounded-lg mt-2">
                    <button id="prev-page" class="bg-slate-800 hover:bg-brand-accent hover:text-black text-slate-200 px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                        <i class="fas fa-chevron-left"></i> Anterior
                    </button>
                    
                    <span id="page-num" class="text-xs text-slate-300 font-medium">Cargando PDF...</span>
                    
                    <button id="next-page" class="bg-slate-800 hover:bg-brand-accent hover:text-black text-slate-200 px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                        Siguiente <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Right: Catalog Order Grid -->
        <aside class="lg:col-span-5 flex flex-col space-y-4">
            <div class="bg-brand-card p-4 rounded-xl border border-brand-border">
                <h2 class="font-bold text-base mb-1">Realizar Pedido</h2>
                <p class="text-xs text-brand-accent font-medium mb-3">⚡ ¡Descuento automático de mayorista al llevar 3 o más unidades!</p>
                
                <input type="text" id="search-input" placeholder="Buscar producto..." class="w-full bg-slate-900 border border-brand-border text-sm rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-brand-accent">
            </div>

            <div id="product-list" class="flex-1 space-y-3 overflow-y-auto max-h-[500px] pr-1">
                <!-- Products loaded from JSON -->
            </div>
        </aside>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="w-full max-w-md bg-brand-card h-full flex flex-col border-l border-brand-border">
            <div class="p-4 border-b border-brand-border flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="fas fa-shopping-bag text-brand-accent"></i> Tu Carrito</h3>
                <button id="cart-close" class="text-slate-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            </div>

            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

            <div class="p-4 bg-brand-card border-t border-brand-border space-y-4">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Subtotal de productos:</span>
                    <span id="cart-subtotal" class="font-bold text-white">$0.00</span>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-300">Nombre del Cliente:</label>
                    <input type="text" id="client-name" placeholder="Tu nombre..." class="w-full bg-slate-900 border border-brand-border text-sm rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-brand-accent">
                </div>

                <button id="btn-whatsapp" class="w-full bg-brand-accent hover:opacity-90 text-black font-bold py-3 rounded-lg flex items-center justify-center space-x-2 transition">
                    <i class="fab fa-whatsapp text-lg"></i>
                    <span>Enviar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "593986492294"; 
        let PRODUCTS = [];
        let cart = {};

        // Cargar productos automáticamente desde productos.json
        async function loadProducts() {
            try {
                const response = await fetch('productos.json');
                PRODUCTS = await response.json();
                renderProducts();
            } catch (error) {
                console.error("Error al cargar productos.json:", error);
            }
        }

        // Visor interactivo PDF
        const pdfUrl = 'Acuario.pdf';
        let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.8,
            canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = { canvasContext: ctx, viewport: viewport };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
            document.getElementById('page-num').textContent = `Página ${num} de ${pdfDoc.numPages}`;
        }

        function queueRenderPage(num) {
            if (pageRendering) pageNumPending = num;
            else renderPage(num);
        }

        document.getElementById('prev-page').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('page-num').textContent = `Página ${pageNum} de ${pdfDoc.numPages}`;
            renderPage(pageNum);
        });

        // Carrito de compras y renderizado
        function renderProducts(filter = '') {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(p => {
                const item = document.createElement('div');
                item.className = 'bg-brand-card border border-brand-border rounded-lg p-3 flex justify-between items-center';
                item.innerHTML = `
                    <div class="pr-2">
                        <div class="text-xs text-brand-accent font-semibold">${p.category}</div>
                        <div class="font-medium text-sm text-slate-100">${p.name}</div>
                        <div class="text-xs text-slate-400">
                            Unitario: <span class="text-slate-200 font-semibold">$${p.price.toFixed(2)}</span> 
                            ${p.price !== p.wholesalePrice ? `<span class="text-[11px] text-brand-accent ml-1">(≥3 unid: $${p.wholesalePrice.toFixed(2)})</span>` : ''}
                        </div>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-slate-800 hover:bg-brand-accent hover:text-black border border-brand-border text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        + Añadir
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCart();
        }

        function changeQty(id, delta) {
            if (cart[id]) {
                cart[id] += delta;
                if (cart[id] <= 0) delete cart[id];
            }
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartSubtotal = document.getElementById('cart-subtotal');
            
            cartItems.innerHTML = '';
            let total = 0, count = 0;

            Object.keys(cart).forEach(id => {
                const p = PRODUCTS.find(prod => prod.id == id);
                const qty = cart[id];
                const isWholesale = qty >= 3 && p.price !== p.wholesalePrice;
                const activePrice = isWholesale ? p.wholesalePrice : p.price;
                const sub = activePrice * qty;
                
                total += sub;
                count += qty;

                const row = document.createElement('div');
                row.className = 'bg-slate-900 border border-brand-border rounded-lg p-3 flex justify-between items-center';
                row.innerHTML = `
                    <div>
                        <div class="font-medium text-sm text-slate-100">${p.name}</div>
                        <div class="text-xs text-slate-400">
                            $${activePrice.toFixed(2)} x ${qty} = <span class="font-semibold text-slate-200">$${sub.toFixed(2)}</span>
                            ${isWholesale ? '<span class="bg-brand-accent/20 text-brand-accent text-[10px] px-1.5 py-0.5 rounded font-bold ml-1">MAYORISTA</span>' : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQty(${p.id}, -1)" class="w-6 h-6 bg-slate-800 text-slate-300 rounded hover:bg-slate-700 flex items-center justify-center font-bold text-sm">-</button>
                        <span class="text-sm font-semibold">${qty}</span>
                        <button onclick="changeQty(${p.id}, 1)" class="w-6 h-6 bg-slate-800 text-slate-300 rounded hover:bg-slate-700 flex items-center justify-center font-bold text-sm">+</button>
                    </div>
                `;
                cartItems.appendChild(row);
            });

            if (count === 0) cartItems.innerHTML = '<p class="text-center text-slate-500 text-sm py-8">El carrito está vacío</p>';

            cartCount.textContent = count;
            cartSubtotal.textContent = `$${total.toFixed(2)}`;
        }

        document.getElementById('search-input').addEventListener('input', (e) => renderProducts(e.target.value));
        document.getElementById('cart-toggle').addEventListener('click', () => document.getElementById('cart-modal').classList.remove('hidden'));
        document.getElementById('cart-close').addEventListener('click', () => document.getElementById('cart-modal').classList.add('hidden'));

        document.getElementById('btn-whatsapp').addEventListener('click', () => {
            const name = document.getElementById('client-name').value.trim();
            if (Object.keys(cart).length === 0) {
                alert('El carrito está vacío.');
                return;
            }

            let msg = `*Nuevo Pedido - Decarbunco 3D*\n`;
            if (name) msg += `*Cliente:* ${name}\n`;
            msg += `-----------------------------------\n`;

            let total = 0;
            Object.keys(cart).forEach(id => {
                const p = PRODUCTS.find(prod => prod.id == id);
                const qty = cart[id];
                const isWholesale = qty >= 3 && p.price !== p.wholesalePrice;
                const activePrice = isWholesale ? p.wholesalePrice : p.price;
                const sub = activePrice * qty;
                total += sub;

                msg += `• ${qty}x ${p.name} - $${sub.toFixed(2)}${isWholesale ? ' *(Precio Mayorista)*' : ''}\n`;
            });

            msg += `-----------------------------------\n`;
            msg += `*Total estimado:* $${total.toFixed(2)}\n\n`;
            msg += `_Nota: Precios no incluyen IVA._`;

            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        });

        // Inicializar
        loadProducts();
    </script>
</body>
</html>
